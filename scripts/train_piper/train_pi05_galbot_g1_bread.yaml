# Full-parameter fine-tuning of LeRobot pi0.5 on the Galbot G1 bread-from-
# microwave demonstrations, using three cameras: head-left, left wrist,
# and right wrist.
#
# Dataset size: 73,826 frames / 100 episodes.
# 8 GPUs x batch_size 4 x 6 gradient-accumulation steps = 192 samples/update.
# Five epochs require 11,536 micro-steps, rounded to 11,538 so the final
# accumulated gradients are applied (1,923 optimizer updates).
#
# The source exposes 38 state/action dimensions. The launch script creates a
# local 23D projection by dropping all chassis position/velocity and odometry fields,
# actions are padded to 32D internally, preserving checkpoint compatibility.

dataset:
  repo_id: Galbot_G1_take_bread_from_microwave_0909_2720_pi05_23d_3cam
  repo_type: dataset
  root: /root/wxwu/dataset/Galbot_G1_take_bread_from_microwave_0909_2720_pi05_23d_3cam
  episodes: null
  exclude_episodes: null
  max_episodes_per_dataset: null
  episode_sampling_seed: 42
  common_feature_keys:
    - observation.state
    - action
  feature_rename_map: {}
  image_transforms:
    enable: false
    max_num_transforms: 3
    random_order: false
    tfs: {}
  revision: null
  use_imagenet_stats: false
  video_backend: torchcodec
  return_uint8: true
  depth_output_unit: mm
  streaming: false
  eval_split: 0.0

env: null

policy:
  type: pi05
  n_obs_steps: 1
  chunk_size: 50
  n_action_steps: 10
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: QUANTILES
    ACTION: QUANTILES
  input_features:
    observation.images.head_left_rgb:
      type: VISUAL
      shape: [3, 224, 224]
    observation.images.left_wrist_rgb:
      type: VISUAL
      shape: [3, 224, 224]
    observation.images.right_wrist_rgb:
      type: VISUAL
      shape: [3, 224, 224]
    observation.state:
      type: STATE
      shape: [23]
  output_features:
    action:
      type: ACTION
      shape: [23]
  device: cuda
  use_amp: false
  use_peft: false
  push_to_hub: false
  repo_id: null
  private: null
  tags: null
  license: null
  pretrained_path: /root/wxwu/model/pi05_base
  pretrained_revision: null
  paligemma_variant: gemma_2b
  action_expert_variant: gemma_300m
  dtype: bfloat16
  max_state_dim: 32
  max_action_dim: 32
  empty_cameras: 0
  image_resolution: [224, 224]
  num_inference_steps: 10
  time_sampling_beta_alpha: 1.5
  time_sampling_beta_beta: 1.0
  time_sampling_scale: 0.999
  time_sampling_offset: 0.001
  min_period: 0.004
  max_period: 4.0
  use_relative_actions: false
  relative_exclude_joints:
    - gripper
  action_feature_names: null
  rtc_config: null
  # Match the previous Galbot bread training run. This keeps activations resident
  # and reproduces its memory/performance profile.
  gradient_checkpointing: false
  compile_model: true
  compile_mode: max-autotune-no-cudagraphs
  freeze_vision_encoder: false
  train_expert_only: false
  optimizer_lr: 2.5e-5
  optimizer_betas: [0.9, 0.95]
  optimizer_eps: 1.0e-8
  optimizer_weight_decay: 0.01
  optimizer_grad_clip_norm: 1.0
  scheduler_warmup_steps: 347
  scheduler_decay_steps: 11538
  scheduler_decay_lr: 2.5e-6
  tokenizer_max_length: 200

reward_model: null
output_dir: /root/wxwu/lerobot_piper/outputs/train/piper_pi05_galbot_g1_bread_bs4_ga6_ep5_3cam
job_name: piper_pi05_galbot_g1_bread_bs4_ga6_ep5_3cam
resume: false
seed: 42
cudnn_deterministic: false
num_workers: 4
batch_size: 4
prefetch_factor: 2
persistent_workers: true
dataloader_multiprocessing_context: spawn
steps: 11538
env_eval_freq: 0
log_freq: 6
eval_steps: 0
max_eval_samples: 0
tolerance_s: 0.0001
save_checkpoint: true
# Save only the final checkpoint to avoid post-save FSDP allocator fragmentation.
save_freq: 0
checkpoint_format: safetensors
use_policy_training_preset: true

optimizer:
  type: adamw
  lr: 2.5e-5
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.01
  grad_clip_norm: 1.0

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 347
  num_decay_steps: 11538
  peak_lr: 2.5e-5
  decay_lr: 2.5e-6

parallelism:
  dp_replicate: 1
  dp_shard: 8
  context_parallel:
    ring_degree: 1
    ulysses_degree: 1
  cfg_parallel: 1

accelerator:
  mixed_precision: bf16
  gradient_accumulation:
    steps: 6
  fsdp:
    reshard_after_forward: true
    wrap_modules: [Linear, Embedding, Conv2d]
    min_num_params: null
    cpu_offload: false
    ignored_modules: null
  ddp:
    find_unused_parameters: true
    gradient_as_bucket_view: false
    static_graph: false
  compile:
    enabled: false
    backend: inductor
    mode: null
    regional: true
  activation_checkpointing:
    mode: none

eval:
  n_episodes: 50
  batch_size: 50
  use_async_envs: true
  recording: false
  recording_repo_id: null
  recording_private: false

ema:
  enable: false
  decay: null
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_decay: 0.0
  max_decay: 0.9999
  use_for_eval: true

wandb:
  enable: true
  disable_artifact: true
  project: lerobot-piper
  entity: null
  notes: Full-parameter pi0.5 fine-tuning on Galbot G1 bread-from-microwave demonstrations; 3 cameras (head-left + both wrists), 8 GPUs x batch=4 x GA6, 5 epochs, 23D action/state (source 38D, chassis fields dropped).
  run_id: null
  mode: online
  add_tags: true

peft: null
save_checkpoint_to_hub: false
sample_weighting: null

rename_map:
  observation.images.image_head_left: observation.images.head_left_rgb
  observation.images.image_arm_right: observation.images.right_wrist_rgb
  observation.images.image_arm_left: observation.images.left_wrist_rgb

job:
  target: null
  image: huggingface/lerobot-gpu:latest
  timeout: 2d
