# Full-parameter fine-tuning of pi0.5 on the cleaned test-tube dataset.
# 8 GPUs x batch_size 4 x 6 gradient-accumulation steps = 192 samples/update.
# 74,357 frames x 4 epochs -> 9,300 micro-steps (rounded to a complete GA cycle).
# The pi0.5 scheduler is expressed in micro-step coordinates; 279 warmup steps
# is 3% x 9,300.

dataset:
  repo_id: PLACE_THE_TEST_TUBE_FIX
  repo_type: dataset
  root: /root/wxwu/dataset/EEG/PLACE_THE_TEST_TUBE_NEW/PLACE_THE_TEST_TUBE_FIX
  episodes: null
  exclude_episodes: null
  max_episodes_per_dataset: null
  episode_sampling_seed: 42
  common_feature_keys:
    - observation.state
    - action
  feature_rename_map: {}
  image_transforms:
    enable: false
    max_num_transforms: 3
    random_order: false
    tfs: {}
  revision: null
  # The merged v2.1 metadata intentionally contains only numeric episode
  # statistics. pi0.5 uses IDENTITY for visual normalization, so no image
  # statistics are needed (and this avoids injecting ImageNet stats into the
  # legacy metadata before the rename map is applied).
  use_imagenet_stats: false
  video_backend: torchcodec
  return_uint8: true
  depth_output_unit: mm
  streaming: false
  eval_split: 0.0

env: null

policy:
  type: pi05
  n_obs_steps: 1
  chunk_size: 50
  n_action_steps: 10
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: QUANTILES
    ACTION: QUANTILES
  input_features:
    observation.images.base_0_rgb:
      type: VISUAL
      shape: [3, 224, 224]
    observation.images.left_wrist_0_rgb:
      type: VISUAL
      shape: [3, 224, 224]
    observation.images.right_wrist_0_rgb:
      type: VISUAL
      shape: [3, 224, 224]
    observation.state:
      type: STATE
      shape: [32]
  output_features:
    action:
      type: ACTION
      shape: [32]
  device: cuda
  use_amp: false
  use_peft: false
  push_to_hub: false
  repo_id: null
  private: null
  tags: null
  license: null
  pretrained_path: /root/wxwu/model/pi05_base
  pretrained_revision: null
  paligemma_variant: gemma_2b
  action_expert_variant: gemma_300m
  dtype: bfloat16
  max_state_dim: 32
  max_action_dim: 32
  empty_cameras: 0
  image_resolution: [224, 224]
  num_inference_steps: 10
  time_sampling_beta_alpha: 1.5
  time_sampling_beta_beta: 1.0
  time_sampling_scale: 0.999
  time_sampling_offset: 0.001
  min_period: 0.004
  max_period: 4.0
  use_relative_actions: false
  relative_exclude_joints:
    - gripper
  action_feature_names: null
  rtc_config: null
  gradient_checkpointing: false
  compile_model: true
  compile_mode: max-autotune-no-cudagraphs
  freeze_vision_encoder: false
  train_expert_only: false
  optimizer_lr: 2.5e-5
  optimizer_betas: [0.9, 0.95]
  optimizer_eps: 1.0e-8
  optimizer_weight_decay: 0.01
  optimizer_grad_clip_norm: 1.0
  scheduler_warmup_steps: 279
  scheduler_decay_steps: 9300
  scheduler_decay_lr: 2.5e-6
  tokenizer_max_length: 200

reward_model: null
output_dir: /root/wxwu/lerobot_piper/outputs/train/piper_pi05_place_test_tube_fix_bs4_ga6_ep4
job_name: piper_pi05_place_test_tube_fix_bs4_ga6_ep4
resume: false
seed: 42
cudnn_deterministic: false
num_workers: 4
batch_size: 4
prefetch_factor: 2
persistent_workers: true
dataloader_multiprocessing_context: spawn
steps: 93000
env_eval_freq: 0
log_freq: 6
eval_steps: 0
max_eval_samples: 0
tolerance_s: 0.0001
save_checkpoint: true
save_freq: 5000
checkpoint_format: safetensors
use_policy_training_preset: true

# Kept explicit for reproducibility; validate() replaces these with the same
# values from the pi0.5 policy preset because use_policy_training_preset=true.
optimizer:
  type: adamw
  lr: 2.5e-5
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.01
  grad_clip_norm: 1.0

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 279
  num_decay_steps: 9300
  peak_lr: 2.5e-5
  decay_lr: 2.5e-6

parallelism:
  dp_replicate: 1
  dp_shard: 8
  context_parallel:
    ring_degree: 1
    ulysses_degree: 1
  cfg_parallel: 1

accelerator:
  mixed_precision: bf16
  gradient_accumulation:
    steps: 6
  fsdp:
    reshard_after_forward: true
    wrap_modules: [Linear, Embedding, Conv2d]
    min_num_params: null
    cpu_offload: false
    ignored_modules: null
  ddp:
    find_unused_parameters: true
    gradient_as_bucket_view: false
    static_graph: false
  compile:
    enabled: false
    backend: inductor
    mode: null
    regional: true
  activation_checkpointing:
    mode: none

eval:
  n_episodes: 50
  batch_size: 50
  use_async_envs: true
  recording: false
  recording_repo_id: null
  recording_private: false

ema:
  enable: false
  decay: null
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_decay: 0.0
  max_decay: 0.9999
  use_for_eval: true

wandb:
  enable: true
  disable_artifact: true
  project: lerobot-piper
  entity: null
  notes: Full-parameter pi0.5 fine-tuning on cleaned test-tube placement demonstrations; task="place the test tube in the test tube rack"; 8 GPUs x batch=4 x GA6, 4 epochs, save every 5000 micro-steps.
  run_id: null
  mode: online
  add_tags: true

peft: null
save_checkpoint_to_hub: false
sample_weighting: null

rename_map:
  observation.images.cam_high: observation.images.base_0_rgb
  observation.images.cam_left_wrist: observation.images.left_wrist_0_rgb
  observation.images.cam_right_wrist: observation.images.right_wrist_0_rgb

job:
  target: null
  image: huggingface/lerobot-gpu:latest
  timeout: 2d
