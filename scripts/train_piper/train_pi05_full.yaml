# Full-parameter fine-tuning of LeRobot pi0.5 on the merged Piper success dataset.
#
# Dataset size: 75,487 frames.
# 8 GPUs x batch_size 4 = 32 samples/micro-step.
# 8 epochs require ceil(75,487 x 8 / 32) = 18,872 micro-steps; this is rounded
# up to 18,876 so the run ends on a complete 6-step gradient-accumulation cycle.
# Effective optimizer batch size: 4 x 8 x 6 = 192 samples.

dataset:
  repo_id: PLACE_THE_TEST_TUBE_SUCCESS_MERGED
  repo_type: dataset
  root: /root/wwx/dataset/PLACE_THE_TEST_TUBE_SUCCESS_MERGED
  episodes: null
  exclude_episodes: null
  max_episodes_per_dataset: null
  episode_sampling_seed: 42
  common_feature_keys:
    - observation.state
    - action
  feature_rename_map: {}
  image_transforms:
    enable: false
    max_num_transforms: 3
    random_order: false
    tfs:
      brightness:
        weight: 1.0
        type: ColorJitter
        kwargs:
          brightness: [0.8, 1.2]
      contrast:
        weight: 1.0
        type: ColorJitter
        kwargs:
          contrast: [0.8, 1.2]
      saturation:
        weight: 1.0
        type: ColorJitter
        kwargs:
          saturation: [0.5, 1.5]
      hue:
        weight: 1.0
        type: ColorJitter
        kwargs:
          hue: [-0.05, 0.05]
      sharpness:
        weight: 1.0
        type: SharpnessJitter
        kwargs:
          sharpness: [0.5, 1.5]
      affine:
        weight: 1.0
        type: RandomAffine
        kwargs:
          degrees: [-5.0, 5.0]
          translate: [0.05, 0.05]
  revision: null
  use_imagenet_stats: true
  video_backend: torchcodec
  return_uint8: true
  depth_output_unit: mm
  streaming: false
  eval_split: 0.0

env: null

policy:
  type: pi05
  n_obs_steps: 1
  chunk_size: 50
  n_action_steps: 10
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: QUANTILES
    ACTION: QUANTILES
  input_features:
    observation.images.base_0_rgb:
      type: VISUAL
      shape: [3, 224, 224]
    observation.images.left_wrist_0_rgb:
      type: VISUAL
      shape: [3, 224, 224]
    observation.images.right_wrist_0_rgb:
      type: VISUAL
      shape: [3, 224, 224]
    observation.state:
      type: STATE
      shape: [32]
  output_features:
    action:
      type: ACTION
      shape: [32]
  device: cuda
  use_amp: false
  use_peft: false
  push_to_hub: false
  repo_id: null
  private: null
  tags: null
  license: null
  pretrained_path: /root/wwx/model/pi05_base
  pretrained_revision: null
  paligemma_variant: gemma_2b
  action_expert_variant: gemma_300m
  dtype: bfloat16
  max_state_dim: 32
  max_action_dim: 32
  empty_cameras: 0
  image_resolution: [224, 224]
  num_inference_steps: 10
  time_sampling_beta_alpha: 1.5
  time_sampling_beta_beta: 1.0
  time_sampling_scale: 0.999
  time_sampling_offset: 0.001
  min_period: 0.004
  max_period: 4.0
  use_relative_actions: false
  relative_exclude_joints:
    - gripper
  action_feature_names: null
  rtc_config: null
  # Explicit leaf-module FSDP wrapping is incompatible with pi0.5's internal
  # checkpoint recomputation (Tensor/DTensor mixing during backward).
  gradient_checkpointing: false
  compile_model: true
  # Autotune kernels without CUDA graphs: safer with FSDP all-gathers and uses
  # less persistent GPU memory than max-autotune/reduce-overhead cudagraph modes.
  compile_mode: max-autotune-no-cudagraphs
  freeze_vision_encoder: false
  train_expert_only: false
  optimizer_lr: 2.5e-5
  optimizer_betas: [0.9, 0.95]
  optimizer_eps: 1.0e-8
  optimizer_weight_decay: 0.01
  optimizer_grad_clip_norm: 1.0
  # Keep the official pi0.5 scheduler preset. LeRobot builds this scheduler in
  # cfg.steps (micro-step) coordinates; because 18,876 < 30,000, it
  # automatically scales warmup 1,000 -> 629 and decay 30,000 -> 18,876.
  scheduler_warmup_steps: 1000
  scheduler_decay_steps: 30000
  scheduler_decay_lr: 2.5e-6
  tokenizer_max_length: 200

reward_model: null
output_dir: /root/wwx/lerobot_piper/outputs/train/piper_pi05_full_bs4_ga6_ep8
job_name: piper_pi05_full_bs4_ga6_ep8
resume: false
seed: 42
cudnn_deterministic: false
num_workers: 4
batch_size: 4
prefetch_factor: 2
persistent_workers: true
dataloader_multiprocessing_context: spawn
steps: 18876
env_eval_freq: 0
log_freq: 6
eval_steps: 0
max_eval_samples: 0
tolerance_s: 0.0001
save_checkpoint: true
# Roughly every two epochs, aligned to GA=6. A final checkpoint is always written.
save_freq: 4716
checkpoint_format: safetensors
use_policy_training_preset: true

# validate() replaces these with the identical pi0.5 policy presets because
# use_policy_training_preset=true. They remain explicit so this is a complete config.
optimizer:
  type: adamw
  lr: 2.5e-5
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.01
  grad_clip_norm: 1.0

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 1000
  num_decay_steps: 30000
  peak_lr: 2.5e-5
  decay_lr: 2.5e-6

parallelism:
  dp_replicate: 1
  dp_shard: 8
  context_parallel:
    ring_degree: 1
    ulysses_degree: 1
  cfg_parallel: 1

accelerator:
  mixed_precision: bf16
  gradient_accumulation:
    steps: 6
  fsdp:
    reshard_after_forward: true
    # Proven pi0.5/FSDP2 setup from the earlier Piper run: shard leaf modules
    # and never let the size-based policy select a ModuleList container.
    wrap_modules: [Linear, Embedding, Conv2d]
    min_num_params: null
    cpu_offload: false
    ignored_modules: null
  ddp:
    find_unused_parameters: true
    gradient_as_bucket_view: false
    static_graph: false
  compile:
    enabled: false
    backend: inductor
    mode: null
    regional: true
  activation_checkpointing:
    mode: none

eval:
  n_episodes: 50
  batch_size: 50
  use_async_envs: true
  recording: false
  recording_repo_id: null
  recording_private: false

ema:
  enable: false
  decay: null
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_decay: 0.0
  max_decay: 0.9999
  use_for_eval: true

wandb:
  enable: true
  # Full pi0.5 checkpoints are very large; metrics/config still sync online.
  disable_artifact: true
  project: lerobot-piper
  entity: null
  notes: Full-parameter pi0.5 fine-tuning on merged successful Piper demonstrations; bs=4, ga=6, epochs=8.
  run_id: null
  mode: online
  add_tags: true

peft: null
save_checkpoint_to_hub: false
sample_weighting: null

rename_map:
  observation.images.cam_high: observation.images.base_0_rgb
  observation.images.cam_left_wrist: observation.images.left_wrist_0_rgb
  observation.images.cam_right_wrist: observation.images.right_wrist_0_rgb

job:
  target: null
  image: huggingface/lerobot-gpu:latest
  timeout: 2d
